name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: python
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq git
          git init
          git remote add origin "https://oauth2:${GH_TOKEN}@git.gagnonbourgault.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD

      - name: Smoke / unit tests
        run: |
          set -eux
          python --version
          if [ -f app/backend/requirements.txt ]; then
            pip install -q -r app/backend/requirements.txt pytest || true
            if [ -d app/backend/tests ]; then
              (cd app/backend && ENV=dev python -m pytest tests/ -q --tb=line -x) || python -m pytest app/backend/tests -q --tb=line -x
              exit 0
            fi
          fi
          if [ -f requirements.txt ]; then
            pip install -q -r requirements.txt pytest || true
          fi
          if [ -d tests ]; then
            python -m pytest tests/ -q --tb=line -x
            exit 0
          fi
          # no tests tree: syntax check
          find . -name "*.py" -not -path "./.git/*" | head -50 | xargs -r python -m py_compile
          echo "smoke ok"

