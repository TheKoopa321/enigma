# Forgejo Packages — enigma (P223 vague 2)
name: Test, Build and Push Docker Image
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
env:
  REGISTRY: git.gagnonbourgault.com
  IMAGE_NAME: ogb-capital/enigma
jobs:

  test:
    runs-on: python
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq git
          git init
          git remote add origin "https://oauth2:${GH_TOKEN}@git.gagnonbourgault.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD

      - name: Smoke / unit tests
        run: |
          set -eux
          python --version
          if [ -f app/backend/requirements.txt ]; then
            pip install -q -r app/backend/requirements.txt pytest || true
            if [ -d app/backend/tests ]; then
              (cd app/backend && ENV=dev python -m pytest tests/ -q --tb=line -x) || python -m pytest app/backend/tests -q --tb=line -x
              exit 0
            fi
          fi
          if [ -f requirements.txt ]; then
            pip install -q -r requirements.txt pytest || true
          fi
          if [ -d tests ]; then
            python -m pytest tests/ -q --tb=line -x
            exit 0
          fi
          # no tests tree: syntax check
          find . -name "*.py" -not -path "./.git/*" | head -50 | xargs -r python -m py_compile
          echo "smoke ok"

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: docker-cli
    defaults:
      run:
        shell: sh
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          apk add --no-cache git
          git init
          git remote add origin "https://oauth2:${GH_TOKEN}@${{ env.REGISTRY }}/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD
      - name: Log in to Forgejo Container Registry
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eux
          USER="${REGISTRY_USER:-olivier}"
          if [ -z "${REGISTRY_TOKEN:-}" ]; then echo "REGISTRY_TOKEN missing" >&2; exit 1; fi
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$USER" --password-stdin
      - name: Build and push
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SHA: ${{ github.sha }}
        run: |
          set -eux
          SHORT_SHA="$(printf '%s' "$SHA" | cut -c1-7)"
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          export DOCKER_BUILDKIT=1
          docker pull "${IMAGE}:latest" || true
          docker build --network=host --cache-from "${IMAGE}:latest" -t "${IMAGE}:latest" -t "${IMAGE}:${SHORT_SHA}" ./app/backend
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${SHORT_SHA}"
      - name: Verify pull
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SHA: ${{ github.sha }}
        run: |
          set -eux
          SHORT_SHA="$(printf '%s' "$SHA" | cut -c1-7)"
          docker pull "${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}"
      - name: Trigger Watchtower update
        continue-on-error: true
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          set -eu
          if [ -z "${INTERNAL_API_KEY:-}" ]; then
            echo "INTERNAL_API_KEY not set — skip watchtower webhook"
            exit 0
          fi
          # LAN origin from ubuntix/dind runners — avoids reverse-proxy 502s.
          # Override via runner env WATCHTOWER_WEBHOOK_URL if needed.
          URL="${WATCHTOWER_WEBHOOK_URL:-http://10.1.1.117:8080/api/webhook/watchtower}"
          echo "POST $URL"
          i=0
          while [ "$i" -lt 3 ]; do
            if wget -qO- --timeout=15 --header="X-Internal-Key: ${INTERNAL_API_KEY}" \
                --post-data='' "$URL"; then
              echo
              echo "Watchtower webhook OK"
              exit 0
            fi
            i=$((i + 1))
            echo "attempt $i failed, retry in 5s..." >&2
            sleep 5
          done
          echo "Watchtower webhook failed after 3 attempts" >&2
          exit 1
